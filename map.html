<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Cost-of-living and weather map on Nomad OS — explore PPI and climate by city worldwide.">
    <meta name="application-name" content="Nomad OS">
    <title>COL & Weather Map · Nomad OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <meta name="theme-color" content="#0a0b0f">
    <link rel="stylesheet" href="styles.css?v=38">
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>

    <main class="app app--map">
        <div class="dashboard-container">
        <header class="header header--subpage">
            <div class="header__top">
                <nav class="dash-nav dash-nav--compact">
                    <a href="index.html" class="dash-nav__link dash-nav__link--brand" aria-label="Nomad OS">
                        <img src="icons/icon.svg" alt="" class="dash-nav__brand-icon" width="22" height="22">
                    </a>
                    <a href="hotels.html" class="dash-nav__link" aria-label="True Cost Stays">🏨</a>
                    <a href="map.html" class="dash-nav__link dash-nav__link--active" aria-label="Map">🗺</a>
                </nav>
                <div class="header__top-actions">
                    <div class="lang-picker">
                        <label for="lang-select" class="lang-picker__label" data-i18n="langLabel">Language</label>
                        <select id="lang-select" class="lang-select" aria-label="Language"></select>
                    </div>
                </div>
            </div>
            <a href="index.html" class="logo logo--link" aria-label="Nomad OS">
                <img src="icons/icon.svg" alt="" class="logo-icon" width="34" height="34">
                <span class="logo-wordmark" aria-hidden="true">
                    <span class="logo-wordmark__nomad">Nomad</span>
                    <span class="logo-wordmark__os">OS</span>
                </span>
            </a>
            <h1 class="dash-page-title" data-i18n="mapPageTitle">Cost-of-Living & Weather Map</h1>
            <p class="tagline" data-i18n="mapPageSub">Click anywhere · search any city · live PPI & weather</p>
        </header>

        <section class="map-layout">
            <aside class="map-sidebar glass-card">
                <h2 class="map-sidebar__title" data-i18n="mapSearch">Search or click map</h2>

                <label class="field-label" for="map-city-search" data-i18n="citySearchLabel">City</label>
                <div class="city-suggest">
                    <input type="search" id="map-city-search" class="currency-search"
                        data-i18n-placeholder="citySearchPlaceholder" placeholder="Search any city…" autocomplete="off"
                        aria-controls="map-city-suggestions">
                    <div id="map-city-suggestions" class="city-suggest__list" role="listbox" hidden></div>
                </div>

                <label class="field-label" for="map-home-currency" data-i18n="mapHome">Home currency</label>
                <select id="map-home-currency" class="currency-select"></select>

                <div class="map-layer-toggles">
                    <p class="map-layer-toggles__label" data-i18n="mapLayers">Map layers</p>
                    <button type="button" id="layer-ppi" class="map-layer-btn">🟢 <span data-i18n="mapLayerPpi">PPP Heatmap</span></button>
                    <button type="button" id="layer-temp" class="map-layer-btn">☀️ <span data-i18n="mapLayerTemp">Temperature</span></button>
                    <button type="button" id="layer-nomad" class="map-layer-btn map-layer-btn--active">☕ <span data-i18n="mapLayerNomad">Nomad Hotspots</span></button>
                </div>

                <p class="map-hint" data-i18n="mapClickHint">Click any point on the map for city details, FX, PPI & weather.</p>
            </aside>

            <div class="map-canvas-wrap glass-card">
                <div id="col-map" class="map-canvas"></div>
                <p id="map-error" class="map-error" hidden data-i18n="mapLoadError">Map failed to load.</p>
            </div>
        </section>
        </div>
    </main>

    <script src="currencies.js?v=16"></script>
    <script src="languages.js?v=16"></script>
    <script src="shared.js?v=16"></script>
    <script src="geocoding.js?v=16"></script>
    <script src="i18n.js?v=33"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="map.js?v=30"></script>
    <script>
        initLanguagePicker();
        applyStaticTranslations();
        initMapPage();
    </script>
</body>
</html>
